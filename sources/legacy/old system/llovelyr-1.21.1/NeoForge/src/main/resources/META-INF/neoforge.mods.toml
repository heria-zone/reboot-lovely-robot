modLoader="javafml"
loaderVersion="[2,)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="${mod_update}"
displayURL="${mod_homepage}"
logoFile="assets/${mod_id}/icon.png"
logoBlur=false
authors="${mod_authors}"
description="${mod_description}"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="geckolib"
    type="required"
    versionRange="[4.0,)"
    ordering="AFTER"
    side="BOTH"