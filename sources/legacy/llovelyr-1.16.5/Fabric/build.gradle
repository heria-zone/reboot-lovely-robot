plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

archivesBaseName = "${mod_id}-fabric-${minecraft_version}"
version = mod_version
group = mod_group

repositories {
    // Add repositories to retrieve artifacts from in here.
    maven { url "https://minecraft.curseforge.com/api/maven/" }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${fabric_yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Add your dependencies here
}

processResources {
    def props = project.ext.getReplaceProperties()
    inputs.properties props

    filesMatching("fabric.mod.json") { expand props }
    filesMatching("${mod_id}.mixins.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    // Ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"

    def targetVersion = 8
    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = targetVersion
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    //withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}"}
    }
}

// Configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${mod_id}-fabric"

            // Add all the jars that should be included when publishing to maven
            artifact(remapJar) {
                builtBy remapJar
            }
            //artifact(sourcesJar) {builtBy remapSourcesJar}
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}