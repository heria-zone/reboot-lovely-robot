# Mod Properties
mod_id=llovelyr
mod_name=LovelyRobot Legacy
mod_version=1.0
mod_group=net.msymbios.llovelyr
mod_authors=MSymbios
mod_license=MIT License
mod_description=Example mod description.
mod_page=https://www.curseforge.com/minecraft/mc-mods/reboot-lovelyrobot
mod_source=https://github.com/heria-zone/reboot-lovely-robot
