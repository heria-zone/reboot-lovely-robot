pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}



rootProject.name = "${mod_name} ${minecraft_version}"
include("Fabric", "Forge")