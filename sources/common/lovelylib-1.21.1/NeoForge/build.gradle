plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

version = lib_version
group = lib_group

base {
    archivesName = "${lib_id}-neoforge-${minecraft_version}"
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    
    // GeckoLib for NeoForge (if needed)
    if (project.hasProperty('needs_geckolib') && needs_geckolib.toBoolean()) {
        implementation "software.bernie.geckolib:${neoforge_geckolib}"
    }
    
    // HZ Lib dependency (NeoForge version, if needed)
    if (project.hasProperty('depends_on_hzlib') && depends_on_hzlib.toBoolean()) {
        def hzLibJar = rootProject.file("libs/hzlib-neoforge-${minecraft_version}-${hzlib_version}.jar")
        if (hzLibJar.exists()) {
            implementation name: "hzlib-neoforge-${minecraft_version}-${hzlib_version}", version: ''
        } else {
            logger.warn("HZLib NeoForge JAR not found: ${hzLibJar.path}. Add the JAR to the libs/ folder.")
        }
    }
    

}

neoForge {
    version = neoforge_version
    
    runs {
        client {
            client()
        }
        
        server {
            server()
        }
    }
    
    mods {
        "${lib_id}" {
            sourceSet sourceSets.main
        }
    }
}



publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = "${lib_name} NeoForge"
                description = "${lib_description} - NeoForge implementation"
                url = "${lib_homepage}"
                
                licenses {
                    license {
                        name = "${lib_license}"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                
                developers {
                    developer {
                        name = "${lib_authors}"
                    }
                }
                
                scm {
                    url = "${lib_source}"
                }
            }
        }
    }
}