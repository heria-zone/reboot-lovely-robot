plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'multiloader-common'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    
    // GeckoLib for Forge (if needed)
    if (project.hasProperty('needs_geckolib') && needs_geckolib.toBoolean()) {
        implementation "${forge_geckolib}"
    }
    
    // HZ Lib dependency (Forge version, if needed)
    if (project.hasProperty('depends_on_hzlib') && depends_on_hzlib.toBoolean()) {
        implementation "net.heriazone.hzlib:hzlib-forge:${minecraft_version}-${hzlib_version}"
    }
    
    // Common module dependency
    implementation project(':Common')
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${lib_id}" {
                    source sourceSets.main
                }
            }
        }
        
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${lib_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = "${lib_name} Forge"
                description = "${lib_description} - Forge implementation"
                url = "${lib_homepage}"
                
                licenses {
                    license {
                        name = "${lib_license}"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                
                developers {
                    developer {
                        name = "${lib_authors}"
                    }
                }
                
                scm {
                    url = "${lib_source}"
                }
            }
        }
    }
}