# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Java
java_version=21
java_level=JAVA_21

# Common
minecraft_version=1.21.1
minecraft_version_range=~1.21.1

# Mappings
mapping_channel=official
mapping_version=1.21.1

# NeoForge Properties
# Check https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.214
neoforge_version_range=[21.1,)
neoforge_loader_version_range=[2,)

# Forge Properties
# Check https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=52.1.0
forge_version_range=[52,)
loader_version_range=[52,)

# Fabric Properties
# Check https://fabricmc.net/develop
fabric_loader_version=0.16.9
fabric_yarn_mappings=1.21.1+build.3
fabric_api_version=0.105.0+1.21.1
loom_version=1.7-SNAPSHOT

# Library Properties - CUSTOMIZE THESE FOR YOUR LIBRARY
lib_id=templatelib
lib_name=Template Lib
lib_version=1.0.0-dev
lib_group=net.heriazone.templatelib
lib_authors=Your Name
lib_license=MIT License
lib_description=Template Lib - Quick project setup for Minecraft libraries.
lib_homepage=https://github.com/yourusername/your-lib
lib_source=https://github.com/yourusername/your-lib
lib_issues=https://github.com/yourusername/your-lib/issues

# Dependencies - CUSTOMIZE FOR YOUR LIBRARY
# Set to true if your library depends on HZ Lib
depends_on_hzlib=false
hzlib_version=1.0.0

# Set to true if your library needs GeckoLib
needs_geckolib=false
neoforge_geckolib=geckolib-neoforge-1.21.1:4.7.3
forge_geckolib=geckolib-forge-1.21.1:4.7.3
fabric_geckolib=geckolib-fabric-1.21.1:4.7.3