plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
}

// FG 5.1.+ requires Gradle 7.x — wrapper is pinned to 7.2
// Java version is handled by sourceCompatibility in multiloader-common.gradle

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GeckoLib for Forge (if needed)
    if (project.hasProperty('needs_geckolib') && needs_geckolib.toBoolean()) {
        implementation fg.deobf("software.bernie.geckolib:${forge_geckolib}")
    }

    // Local library dependencies (Forge versions) — dual-path resolution
    if (project.hasProperty('depends_on_lovelylib') && depends_on_lovelylib.toBoolean()) {
        def lovelyLibBuildJar = rootProject.hasProperty('lovelylib_project_path')
                ? new File(rootProject.file(rootProject.lovelylib_project_path), "Forge/build/libs/lovelylib-forge-${minecraft_version}-${lovelylib_version}.jar")
                : null
        def lovelyLibLocalJar = rootProject.file("libs/lovelylib-forge-${minecraft_version}-${lovelylib_version}.jar")
        if (lovelyLibLocalJar.exists() || (lovelyLibBuildJar != null && lovelyLibBuildJar.exists())) {
            implementation name: "lovelylib-forge-${minecraft_version}-${lovelylib_version}", version: ''
        } else {
            logger.warn("LovelyLib Forge JAR not found. Run 'gradle refreshDependencies' first.")
        }
    }

    if (project.hasProperty('depends_on_hzlib') && depends_on_hzlib.toBoolean()) {
        def hzLibBuildJar = rootProject.hasProperty('hzlib_project_path')
                ? new File(rootProject.file(rootProject.hzlib_project_path), "Forge/build/libs/hzlib-forge-${minecraft_version}-${hzlib_version}.jar")
                : null
        def hzLibLocalJar = rootProject.file("libs/hzlib-forge-${minecraft_version}-${hzlib_version}.jar")
        if (hzLibLocalJar.exists() || (hzLibBuildJar != null && hzLibBuildJar.exists())) {
            implementation name: "hzlib-forge-${minecraft_version}-${hzlib_version}", version: ''
        } else {
            logger.warn("HZLib Forge JAR not found. Run 'gradle refreshDependencies' first.")
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory project.file('runs/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('runs/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('runs/data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    var replaceProperties = [
            minecraft_version     : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version         : forge_version,
            forge_version_range   : forge_version_range,
            loader_version_range  : loader_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description,
            mod_homepage          : mod_homepage,
            mod_source            : mod_source,
            mod_issues            : mod_issues,
            mod_group             : mod_group
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    filesMatching("${mod_id}.mixins.json") {
        expand replaceProperties
    }
}

jar.finalizedBy('reobfJar')

jar {
    from("../Common/LICENSE") {
        rename { "${it}_${project.base.archivesName}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Do NOT set options.release when targeting Java 8 — use sourceCompatibility instead
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact jar

            pom {
                name = "${mod_name} Forge"
                description = "${mod_description} - Forge implementation"
                url = "${mod_homepage}"

                licenses {
                    license {
                        name = "${mod_license}"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        name = "${mod_authors}"
                    }
                }

                scm {
                    url = "${mod_source}"
                }
            }
        }
    }
}
