# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Java
java_version=8
java_level=JAVA_8

# Common
minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)

# Mappings
mapping_channel=official
mapping_version=1.16.5

# Forge Properties
# Check https://files.minecraftforge.net/net/minecraftforge/forge/
# ForgeGradle 5.1.+ requires Gradle 7.x — do NOT upgrade wrapper beyond 7.x
forge_version=36.2.42
forge_version_range=[36,)
loader_version_range=[36,)
forge_geckolib=geckolib-forge-1.16.5:3.0.106

# Fabric Properties
# Check https://fabricmc.net/develop
fabric_loader_version=0.11.3
loom_version=0.10-SNAPSHOT
fabric_geckolib=geckolib-fabric-1.16.5:3.0.107
fabric_api_version=0.34.2+1.16

# Mod Properties - CUSTOMIZE THESE FOR YOUR MOD
mod_id=templatemod
mod_name=Template Mod
mod_version=1.0.0-dev
mod_group=net.heriazone.templatemod
mod_authors=Your Name
mod_license=MIT License
mod_description=Template Mod - Quick project setup for Minecraft mods.
mod_homepage=https://github.com/yourusername/your-mod
mod_source=https://github.com/yourusername/your-mod
mod_issues=https://github.com/yourusername/your-mod/issues

# Dependencies - CUSTOMIZE FOR YOUR MOD
# Set to true if your mod depends on HZ Lib
depends_on_hzlib=false
hzlib_version=1.0.0

# Set to true if your mod depends on Lovely Lib (includes hzlib)
depends_on_lovelylib=false
lovelylib_version=1.0.0-dev

# Set to true if your mod needs GeckoLib
needs_geckolib=false

# Local Development Dependencies
# Path to HZLib for local development (if using)
hzlib_project_path=../../common/hzlib-1.16.5

# Path to LovelyLib for local JAR dependencies (if using)
lovelylib_project_path=../../common/lovelylib-1.16.5
