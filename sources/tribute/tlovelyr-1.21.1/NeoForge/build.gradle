plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    
    // GeckoLib for NeoForge (if needed)
    if (project.hasProperty('needs_geckolib') && needs_geckolib.toBoolean()) {
        implementation "${neoforge_geckolib}"
    }
    
    // Local library dependencies (NeoForge versions) - only if JARs exist
    if (project.hasProperty('depends_on_lovelylib') && depends_on_lovelylib.toBoolean()) {
        def lovelyLibJar = rootProject.file("libs/lovelylib-neoforge-${minecraft_version}-${lovelylib_version}.jar")
        if (lovelyLibJar.exists()) {
            implementation name: "lovelylib-neoforge-${minecraft_version}-${lovelylib_version}", version: ''
        } else {
            logger.warn("LovelyLib NeoForge JAR not found: ${lovelyLibJar.path}. Run 'gradle refreshDependencies' first.")
        }
    } else if (project.hasProperty('depends_on_hzlib') && depends_on_hzlib.toBoolean()) {
        def hzLibJar = rootProject.file("libs/hzlib-neoforge-${minecraft_version}-${hzlib_version}.jar")
        if (hzLibJar.exists()) {
            implementation name: "hzlib-neoforge-${minecraft_version}-${hzlib_version}", version: ''
        }
    }
    

}

neoForge {
    version = neoforge_version
    
    runs {
        client {
            client()
        }
        
        server {
            server()
        }
    }
    
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_homepage: mod_homepage,
            mod_source: mod_source,
            mod_issues: mod_issues,
            mod_group: mod_group,
            lovelylib_version: lovelylib_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    filesMatching("${mod_id}.mixins.json") {
        expand replaceProperties
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = "${mod_name} NeoForge"
                description = "${mod_description} - NeoForge implementation"
                url = "${mod_homepage}"
                
                licenses {
                    license {
                        name = "${mod_license}"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                
                developers {
                    developer {
                        name = "${mod_authors}"
                    }
                }
                
                scm {
                    url = "${mod_source}"
                }
            }
        }
    }
}