plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name.toLowerCase()}"
}

version = "${minecraft_version}-${mod_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = uri('https://repo.spongepowered.org/repository/maven-public')
            }
        }
        filter {
            includeGroupAndSubgroups("org.spongepowered")
        }
    }
    
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    
    // Local library dependencies
    flatDir {
        dirs rootProject.file('libs')
    }

    // Development fallback: LovelyLib and HZLib Common build output
    // These are always added — harmless if the directories don't exist
    flatDir {
        dirs rootProject.file('../../common/lovelylib-1.21.1/Common/build/libs')
        dirs rootProject.file('../../common/hzlib-1.21.1/Common/build/libs')
    }
}

dependencies {
    // Common-module dependencies — both lovelylib and hzlib are independent blocks
    if (project.name == 'Common') {

        if (project.hasProperty('depends_on_lovelylib') && depends_on_lovelylib.toBoolean()) {
            def lovelyLibBuildJar = rootProject.hasProperty('lovelylib_project_path')
                    ? new File(rootProject.file(rootProject.lovelylib_project_path), "Common/build/libs/lovelylib-Common-${minecraft_version}-${lovelylib_version}.jar")
                    : null
            def lovelyLibLocalJar = rootProject.file("libs/lovelylib-Common-${minecraft_version}-${lovelylib_version}.jar")
            if (lovelyLibLocalJar.exists() || (lovelyLibBuildJar != null && lovelyLibBuildJar.exists())) {
                api name: "lovelylib-Common-${minecraft_version}-${lovelylib_version}", version: ''
            } else {
                logger.warn("LovelyLib Common JAR not found. Build LovelyLib first.")
            }
        }

        if (project.hasProperty('depends_on_hzlib') && depends_on_hzlib.toBoolean()) {
            def hzLibBuildJar = rootProject.hasProperty('hzlib_project_path')
                    ? new File(rootProject.file(rootProject.hzlib_project_path), "Common/build/libs/hzlib-Common-${minecraft_version}-${hzlib_version}.jar")
                    : null
            def hzLibLocalJar = rootProject.file("libs/hzlib-Common-${minecraft_version}-${hzlib_version}.jar")
            if (hzLibLocalJar.exists() || (hzLibBuildJar != null && hzLibBuildJar.exists())) {
                api name: "hzlib-Common-${minecraft_version}-${hzlib_version}", version: ''
            } else {
                logger.warn("HZLib Common JAR not found. Build HZLib first.")
            }
        }

    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(java_version)
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

// Declare capabilities on the outgoing configurations.
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:$mod_id-${project.name}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "${mod_id}",
            "Specification-Vendor": "${mod_authors}",
            "Specification-Version": "1",
            "Implementation-Title": "${mod_name}",
            "Implementation-Version": "${mod_version}",
            "Implementation-Vendor": "${mod_authors}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}