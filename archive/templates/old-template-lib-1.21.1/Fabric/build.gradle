plugins {
    id 'fabric-loom'
    id 'multiloader-common'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${fabric_yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    
    // GeckoLib for Fabric (if needed)
    if (project.hasProperty('needs_geckolib') && needs_geckolib.toBoolean()) {
        modImplementation "${fabric_geckolib}"
    }
    
    // HZ Lib dependency (Fabric version, if needed)
    if (project.hasProperty('depends_on_hzlib') && depends_on_hzlib.toBoolean()) {
        modApi "net.heriazone.hzlib:hzlib-fabric:${minecraft_version}-${hzlib_version}"
    }
    
    // Common module dependency
    implementation project(':Common')
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = "${lib_name} Fabric"
                description = "${lib_description} - Fabric implementation"
                url = "${lib_homepage}"
                
                licenses {
                    license {
                        name = "${lib_license}"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                
                developers {
                    developer {
                        name = "${lib_authors}"
                    }
                }
                
                scm {
                    url = "${lib_source}"
                }
            }
        }
    }
}